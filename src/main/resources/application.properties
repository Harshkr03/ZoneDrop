spring.application.name=ZoneDrop

server.port=${SERVER_PORT:8081}

## Postgres DB
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zonedrop_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

## JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## BLOB Storage
supabase.url=${SUPABASE_URL}
supabase.serviceKey=${SUPABASE_SERVICE_KEY}
supabase.bucket=${SUPABASE_BUCKET:files}

## REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}

## JWT
jwt.secretKey=${JWT_SECRET_KEY}
