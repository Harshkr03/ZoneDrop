<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoneDrop Users</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="users">
<div class="shell">
    <header class="topbar">
        <a class="brand" href="/dashboard.html">ZoneDrop</a>
        <nav class="nav">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/upload.html">Uploads</a>
            <a href="/nearby.html">Map</a>
        </nav>
        <div class="nav-actions">
            <span id="auth-user-pill" class="user-pill"></span>
            <button id="logout-button" type="button" class="button secondary">Logout</button>
        </div>
    </header>

    <section class="page-intro">
        <span class="eyebrow">User Management</span>
        <h1>Create users and update their live location.</h1>
        <p>All protected API calls on this screen are authenticated with the JWT issued during signup or login.</p>
    </section>

    <section class="grid-2">
        <article class="panel">
            <h2>Create User</h2>
            <form id="create-user-form">
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" placeholder="Anaya Rao" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="anaya@example.com" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Create a secure password" required>
                </div>
                <div class="actions">
                    <button type="submit">Create User</button>
                </div>
                <div id="create-user-status" class="status"></div>
            </form>
        </article>

        <article class="panel">
            <h2>Update Location</h2>
            <form id="update-location-form">
                <div class="field">
                    <label for="location-user-id">User</label>
                    <select id="location-user-id" name="userId" required></select>
                </div>
                <div class="field">
                    <label for="latitude">Latitude</label>
                    <input id="latitude" name="latitude" type="number" step="any" placeholder="12.9716" required>
                </div>
                <div class="field">
                    <label for="longitude">Longitude</label>
                    <input id="longitude" name="longitude" type="number" step="any" placeholder="77.5946" required>
                </div>
                <div class="actions">
                    <button type="submit">Save Location</button>
                </div>
                <div id="update-location-status" class="status"></div>
            </form>
        </article>
    </section>

    <section class="panel section-gap">
        <h2>Current Users</h2>
        <div id="users-list" class="list"></div>
    </section>
</div>
<script src="/app.js"></script>
</body>
</html>
